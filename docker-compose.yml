services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: resume_coach
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      # PostgreSQL 18+ stores versioned data below this mount.
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
