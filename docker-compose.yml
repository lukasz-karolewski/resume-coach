services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: resume_coach
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18+ stores versioned data below this mount.
      - postgres_data:/var/lib/postgresql

  redis:
    restart: unless-stopped
    image: "redis/redis-stack-server:latest"
    ports:
      - 6379:6379
    volumes:
      - redisdata:/data
    environment:
      # Enable persistence - save to disk every 60 seconds if at least 1 key changed
      - REDIS_ARGS=--save 60 1

volumes:
  postgres_data:
  redisdata:
